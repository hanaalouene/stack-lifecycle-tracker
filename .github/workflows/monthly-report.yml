name: monthly-version-report

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated database back

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Fetch versions, build report, send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run.py run
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
      - name: Save the new snapshot in the repo
        run: |
          git config user.name "version-watch-bot"
          git config user.email "version-watch-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: monthly snapshot"
          git push
